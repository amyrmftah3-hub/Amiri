name: Build AMIRI APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'AMIRI-Android-Source.tar.gz'
      - 'README.md'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract Android project
        run: mkdir -p buildsrc && tar -xzf AMIRI-Android-Source.tar.gz -C buildsrc
      - name: Build debug APK
        working-directory: buildsrc/Amiri-Android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMIRI-debug-apk
          path: buildsrc/Amiri-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
